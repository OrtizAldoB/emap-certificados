name: emap
description: "EMAP - Extraccion de Aportaciones desde Estados de Ahorro Previsional (PDF a Excel)"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^8.1.4
  excel: ^4.0.6
  path_provider: ^2.1.5
  path: ^1.9.0
  pdfrx: ^2.4.0
  window_manager: ^0.4.3
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/